name: Bug report / Relatar problema
description: Help reproduce a problem without sharing a private PDF.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result / Passos e resultado esperado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App version, macOS, Mac model and RAM
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error and minimal example
      description: Remove personal data. Do not upload confidential documents.
